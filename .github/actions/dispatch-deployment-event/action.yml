name: Dispatch Deployment Event
description: Dispatch a deployment event
inputs:
  event_name:
    description: The name of the deployment event
    required: true
  repository:
    description: The repository name
    required: true
  app_id:
    description: The app id
    required: true
  private_key:
    description: The private key
    required: true
runs:
  using: composite
  steps:
    - name: Find associated pull request
      uses: Energinet-DataHub/.github/.github/actions/find-related-pr-number@aebdf4aa8ea6e744e78032c89290866731d31be2 # actions/v2
      id: find_pull_request

    - name: Generate Github token
      id: generate_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: Energinet-Datahub

    - name: Repository Dispatch
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
      with:
        token: ${{ steps.generate_token.outputs.token }}
        repository: ${{ inputs.repository }}
        event-type: ${{ inputs.event_name }}
        # yamllint disable-line rule:quoted-strings
        client-payload: '{"pr_number": "${{ steps.find_pull_request.outputs.pull_request_number }}", "${{ inputs.event_name }}": "true"}'
