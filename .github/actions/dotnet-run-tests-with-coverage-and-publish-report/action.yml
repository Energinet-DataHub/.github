name: Run tests - publish report
description: Run all tests with dotnet coverage and publish test reports

# TEST RUNNERS:
# The action supports both of the .NET test runners, selected by which of the two
# mutually exclusive path inputs is set:
#
#   'tests_dll_file_path' (VSTest)
#     Runs 'dotnet test <assembly.dll>'. This is the classic runner, used by xUnit v2.
#
#   'tests_project_file_path' (Microsoft.Testing.Platform)
#     Runs 'dotnet test --project <project.csproj>'. Used by xunit.v3. Passing a test
#     assembly positionally and '--logger' are VSTest specific and are rejected by
#     Microsoft.Testing.Platform, so the project file is passed instead. This works here
#     because the calling workflow checks out the source and builds the solution.
#
#     The repository must opt in to the platform through the 'test' section of a
#     'global.json' that is resolved by searching upwards from the working directory:
#
#       "test": { "runner": "Microsoft.Testing.Platform" }
#
#     The test project must also reference 'Microsoft.Testing.Extensions.TrxReport', whose
#     major version has to match the platform version of the test framework (for xunit.v3
#     4.0.0 that is version 2.x). Referencing 1.x builds fine but fails at runtime with a
#     TypeLoadException that only surfaces as 'Zero tests ran'.

inputs:
  run_integration_tests:
    description: Run integration tests
    required: true
  azure_integrationtest_spn_id:
    description: Service principal ID for Azure resources
    required: true
  azure_integrationtest_tenant_id:
    description: Tenant ID for Azure resources
    required: true
  azure_integrationtest_subscription_id:
    description: Subscription ID for Azure resources
    required: true
  aspnetcore_test_contentroot_variable_name:
    description: Name of an environment variable used for configuration of WebApplicationFactory<TEntryPoint>
    required: true
  aspnetcore_test_contentroot_variable_value:
    description: Value of an environment variable used for configuration of WebApplicationFactory<TEntryPoint>
    required: true
  tests_filter_expression:
    description: Filter expression to use with dotnet test
    required: true
  publish_test_report:
    description: Set to 'false' to skip publishing test report
    required: false
    default: "true"
  tests_dll_file_path:
    description: Relative path from artifacts folder to test assembly. Runs the tests using VSTest. Mutually exclusive with 'tests_project_file_path'.
    required: false
    default: ""
  tests_project_file_path:
    description: Path to the test project file, relative to the repository root. Runs the tests using Microsoft.Testing.Platform, as used by xunit.v3. Mutually exclusive with 'tests_dll_file_path'.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate test path inputs
      id: validate_inputs
      shell: pwsh
      run: |
        $dllPath = '${{ inputs.tests_dll_file_path }}'
        $projectPath = '${{ inputs.tests_project_file_path }}'

        if ( $dllPath -eq '' -and $projectPath -eq '' )
        {
          Write-Host "::error::Either 'tests_dll_file_path' or 'tests_project_file_path' must be set."
          Exit 1
        }
        if ( $dllPath -ne '' -and $projectPath -ne '' )
        {
          Write-Host "::error::'tests_dll_file_path' and 'tests_project_file_path' are mutually exclusive, set only one of them."
          Exit 1
        }

    - name: Login to use Azure resources from automated tests
      if: ${{ inputs.run_integration_tests == 'true' }}
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure_integrationtest_spn_id }}
        tenant-id: ${{ inputs.azure_integrationtest_tenant_id }}
        subscription-id: ${{ inputs.azure_integrationtest_subscription_id }}
        allow-no-subscriptions: true # Added as a workaround for the issue https://github.com/Azure/login/issues/592

    # To ensure code coverage tooling is available in bin folders, teams must use 'publish' on test assemblies
    # See https://github.com/coverlet-coverage/coverlet/issues/521#issuecomment-522429394
    - name: Run tests
      if: ${{ inputs.tests_dll_file_path != '' }}
      shell: pwsh
      run: |
        Write-Host 'Installing dotnet.coverage ...'

        # Configure content root for WebApplicationFactory<TEntryPoint>
        if ( '${{ inputs.aspnetcore_test_contentroot_variable_name }}' -ne 'empty' )
        {
          $Env:${{ inputs.aspnetcore_test_contentroot_variable_name }} = '${{ github.workspace }}${{ inputs.aspnetcore_test_contentroot_variable_value }}'
        }
        # Handle filter expression
        if ( '${{ inputs.tests_filter_expression }}' -eq 'empty' )
        {
          dotnet test ${{ github.workspace }}${{ inputs.tests_dll_file_path }} `
            --logger:"console;verbosity=normal" --logger:"trx;logfilename=logs.trx" `
        }
        else
        {
          dotnet test ${{ github.workspace }}${{ inputs.tests_dll_file_path }} `
            --filter '${{ inputs.tests_filter_expression }}' `
            --logger:"console;verbosity=normal" --logger:"trx;logfilename=logs.trx" `
        }

        $testFailures = Select-String -Path '.\TestResults\logs.trx' -Pattern '\[FAIL\]'
        $testFailures

    - name: Run tests (Microsoft.Testing.Platform)
      if: ${{ inputs.tests_project_file_path != '' }}
      shell: pwsh
      run: |
        # Configure content root for WebApplicationFactory<TEntryPoint>
        if ( '${{ inputs.aspnetcore_test_contentroot_variable_name }}' -ne 'empty' )
        {
          $Env:${{ inputs.aspnetcore_test_contentroot_variable_name }} = '${{ github.workspace }}${{ inputs.aspnetcore_test_contentroot_variable_value }}'
        }

        $projectFile = '${{ github.workspace }}\${{ inputs.tests_project_file_path }}'
        if ( -not (Test-Path $projectFile) )
        {
          Write-Host "::error::Test project file not found: $projectFile"
          Exit 1
        }

        # Written to a well known location so the report steps can find it. 'Release' matches the
        # 'Build solution' step of 'dotnet-postbuild-test-monorepo.yml', which is what '--no-build'
        # relies on here.
        $resultsDirectory = '${{ github.workspace }}\TestResults'
        $arguments = @(
          'test'
          '--project', $projectFile
          '--configuration', 'Release'
          '--no-build'
          '--results-directory', $resultsDirectory
          '--report-trx'
          '--report-trx-filename', 'logs.trx'
        )

        # An empty filter is treated as no filter. VSTest tolerates '--filter ""', but
        # Microsoft.Testing.Platform matches zero tests and would exit 8.
        $filterExpression = '${{ inputs.tests_filter_expression }}'
        if ( $filterExpression -ne 'empty' -and -not [string]::IsNullOrWhiteSpace($filterExpression) )
        {
          $arguments += @('--filter', $filterExpression)
        }

        Write-Host "dotnet $($arguments -join ' ')"
        dotnet @arguments
        $testExitCode = $LASTEXITCODE

        $trxFile = Join-Path $resultsDirectory 'logs.trx'
        if ( Test-Path $trxFile )
        {
          Select-String -Path $trxFile -Pattern 'outcome="Failed"'
        }

        # Any non zero exit code is a failure. Note that Microsoft.Testing.Platform exits with 8
        # when zero tests ran, which would otherwise silently hide a broken filter expression.
        if ( $testExitCode -ne 0 )
        {
          Write-Host "::error::Test run failed with exit code $testExitCode"
          Exit $testExitCode
        }

    # 'always()' lets the report be published for failing tests, but must not let it run when the
    # inputs never named a test project, as there would be no results to report on
    - name: Publish test report
      if: ${{ always() && inputs.publish_test_report == 'true' && steps.validate_inputs.outcome == 'success' }}
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      with:
        check_name: Test results for ${{ inputs.tests_dll_file_path || inputs.tests_project_file_path }}
        comment_title: Test results for ${{ inputs.tests_dll_file_path || inputs.tests_project_file_path }}
        comment_mode: failures
        files: |
          **/TestResults/*.trx
