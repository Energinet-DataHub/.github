name: Python Lint and Format
description: Lint and format a package with Ruff
inputs:
  name:
    description: The name of the package
    required: true
  pat_token:
    description: The GitHub PAT token for authentication
    required: true
  path:
    description: The path to the package
    required: true
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        ignore-nothing-to-cache: true
        cache-suffix: ${{ inputs.name }}
        cache-dependency-glob: |
          ${{ inputs.path }}/pyproject.toml
          ${{ inputs.path }}/uv.lock

    - name: Inject pat_token into git configuration
      shell: bash
      run: |
        git config --global url."https://oauth2:${{ inputs.pat_token }}@github.com".insteadOf https://github.com

    - name: Lint
      shell: bash
      run: uv run --directory ${{ inputs.path }} ruff check

    - name: Format
      shell: bash
      run: uv run --directory ${{ inputs.path }} ruff format --check
