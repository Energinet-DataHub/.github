name: .NET test

# DESCRIPTION:
# This workflow will run tests and code coverage of .NET xUnit test projects
# that has been previously builded and uploaded as the 'dotnet-tests' artifact.
#
# It is intended to run tests in one .NET xUnit test project, and support
# filters, so developers can split the execution of tests on multiple runners
# and utilize parallel execution to reduce the overall workflow execution time.
#
# To prepare the 'dotnet-tests' artifact run the 'dotnet-solution-ci-build.yml'
# workflow as a job in parallel of the test workflow. This allows steps of the
# test workflow to utilize the build time for setting up the job for executing tests.
#
# The download step will use a retry action to wait for the 'dotnet-tests'
# artifact to be ready. Each failing download attempt will be written to the build
# log as an error, but can be ignored. If the build takes too long, the test
# job will fail after the last retry attempt.
#
# TEST RUNNERS:
# The workflow supports both of the .NET test runners, selected by which of the two
# mutually exclusive path inputs is set:
#
#   'tests_dll_file_path' (VSTest)
#     Runs 'dotnet test <assembly.dll>'. This is the classic runner, used by xUnit v2.
#
#   'tests_exe_file_path' (Microsoft.Testing.Platform)
#     Runs the published test executable directly. Used by xunit.v3, where a test project
#     is a self contained executable. Note that 'dotnet test <assembly.dll>' and '--logger'
#     are VSTest specific and are rejected by Microsoft.Testing.Platform, and that its
#     alternative, 'dotnet test --project <csproj>', is not usable in this workflow because
#     the job only downloads the build artifact and never has the source tree available.
#
#     The test project must opt in to the platform, otherwise the published executable is
#     xunit.v3's own console runner, which uses a different command line ('-filterVSTest' and
#     '-result-trx') and rejects the arguments used below:
#
#       <UseMicrosoftTestingPlatformRunner>true</UseMicrosoftTestingPlatformRunner>
#
#     It must also reference 'Microsoft.Testing.Extensions.TrxReport', whose major version has
#     to match the platform version of the test framework (for xunit.v3 4.0.0 that is version
#     2.x). Referencing 1.x builds fine but fails at runtime with a TypeLoadException that only
#     surfaces as 'Zero tests ran'.

on:
  workflow_call:
    inputs:
      job_name:
        description: Set job name so it is easier to identify job in workflow summary
        required: false
        default: .NET CI Test
        type: string
      tests_dll_file_path:
        description: Relative path from artifacts folder to test assembly. Runs the tests using VSTest. Mutually exclusive with 'tests_exe_file_path'.
        required: false
        default: ""
        type: string
      tests_exe_file_path:
        description: Relative path from artifacts folder to the published test executable. Runs the tests using Microsoft.Testing.Platform, as used by xunit.v3. Mutually exclusive with 'tests_dll_file_path'.
        required: false
        default: ""
        type: string
      tests_filter_expression:
        description: Filter expression to use when selecting tests. Uses VSTest filter syntax for both test runners.
        required: false
        default: empty
        type: string
      aspnetcore_test_contentroot_variable_name:
        description: Name of an environment variable used for configuration of WebApplicationFactory<TEntryPoint>
        required: false
        default: empty # Cannot be '', it must contain a string that is also valid environment name
        type: string
      aspnetcore_test_contentroot_variable_value:
        description: Value of an environment variable used for configuration of WebApplicationFactory<TEntryPoint>
        required: false
        default: ""
        type: string
      dotnet_version:
        description: Install specified .NET Core SDK version
        required: false
        type: string
      operating_system:
        description: Must be a version of Windows, we do not support Linux for testing
        required: false
        default: windows-2022
        type: string
      download_attempt_limit:
        description: Number of times we retry downloading dotnet-tests artifact (effectively waiting for the build job to complete)
        required: false
        default: 12
        type: number
      use_cosmos_db_emulator:
        description: Install Cosmos DB emulator to support testing
        required: false
        default: false
        type: boolean
      # Node and modules
      use_azure_functions_tools:
        description: Install Azurite and Azure Functions Core Tools to support testing
        required: false
        default: false
        type: boolean
      node_version:
        description: Install specified Node.js version
        required: false
        default: "24"
        type: string
      azurite_version:
        description: Install specified Azurite version
        required: false
        default: 3.36.0
        type: string
      azure_functions_core_tools_version:
        description: Install specified Azure Functions Core Tools version
        required: false
        default: 4.0.6594
        type: string
      # SQL LocalDB 2019
      use_sqllocaldb_2019:
        required: false
        default: false
        type: boolean
      environment:
        description: Can be used to set environment for OIDC which is AzureAuth
        required: false
        default: ""
        type: string
      run_integration_tests:
        description: Set to 'true' to log into Azure for executing integration tests
        required: false
        default: false
        type: boolean
      azure_integrationtest_spn_id:
        description: Azure Service Principal for executing integration tests
        required: false
        default: ""
        type: string
      azure_integrationtest_tenant_id:
        description: Azure Tenant ID for executing integration tests
        required: false
        default: ""
        type: string
      azure_integrationtest_subscription_id:
        description: Azure subscription ID for executing integration tests
        required: false
        default: ""
        type: string
      azure_keyvault_url:
        description: Azure Keyvault URL with secrets used in integration tests
        required: false
        default: ""
        type: string
      nuget_cache_key_prefix:
        # Deprecated and no longer used. The NuGet cache step this fed was removed, as this job never
        # checks out source or restores packages. Kept only so that consumers still passing it do not
        # break, since an undeclared input is a hard error for a reusable workflow.
        description: Deprecated, no longer used
        required: false
        type: string
        default: nuget-${{ inputs.operating_system }}-pr${{ github.event.pull_request.number || '_not_available' }}  # PR number is not available in merge_group event (Merge queue)
      publish_test_results:
        description: Should the test results be published
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  issues: read # Needed by EnricoMi/publish-unit-test-result-action
  checks: write # Needed by EnricoMi/publish-unit-test-result-action
  pull-requests: write # Needed by EnricoMi/publish-unit-test-result-action
  actions: read # Needed by gh run download

jobs:
  dotnet_ci_test:
    name: ${{ inputs.job_name }}
    runs-on: ${{ inputs.operating_system }}

    environment: ${{ inputs.environment }}

    env:
      ARTIFACTS_PATH: ${{ github.workspace }}\artifacts
      # Necessary to manage Azure resources from automated tests
      AZURE_KEYVAULT_URL: ${{ inputs.azure_keyvault_url }}
      #
      # Only relevant if 'use_azure_functions_tools' is TRUE
      #
      # Set value used by 'AzuriteManager'
      #  Use 'AzuriteBlobFolderPath' for TestCommon version 4.2.0 and lower
      AzuriteBlobFolderPath: ${{ github.workspace }}\node_modules\.bin\
      #  Use 'AzuriteFolderPath' for TestCommon version 4.3.0 and higher
      AzuriteFolderPath: ${{ github.workspace }}\node_modules\.bin\
      # Overrides settings in 'functionhost.settings.json'
      FunctionAppHostPath: ${{ github.workspace }}\node_modules\azure-functions-core-tools\bin\func.dll
    steps:
      - name: Validate test path inputs
        id: validate_inputs
        shell: pwsh
        run: |
          $dllPath = '${{ inputs.tests_dll_file_path }}'
          $exePath = '${{ inputs.tests_exe_file_path }}'
          if ( $dllPath -eq '' -and $exePath -eq '' )
          {
            Write-Host "::error::Either 'tests_dll_file_path' or 'tests_exe_file_path' must be set."
            Exit 1
          }
          if ( $dllPath -ne '' -and $exePath -ne '' )
          {
            Write-Host "::error::'tests_dll_file_path' and 'tests_exe_file_path' are mutually exclusive, set only one of them."
            Exit 1
          }

      - name: Setup .NET ${{ inputs.dotnet_version }}
        if: ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      # If the emulator is not started within <timeout> seconds the 'Start-CosmosDbEmulator' timeout.
      # We have added a retry action to see if this can mitigate builds failing on this account.
      - name: Setup Azure Cosmos DB Emulator (with retry)
        if: ${{ inputs.use_cosmos_db_emulator == true }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          shell: pwsh
          command: |
            Write-Host "Start Cosmos DB Emulator..."
            Import-Module "$env:ProgramFiles\Azure Cosmos DB Emulator\PSModules\Microsoft.Azure.CosmosDB.Emulator"
            $error.Clear()
            Start-CosmosDbEmulator -NoUI -Timeout 240
            if ($error)
            {
              Write-Host "Failed"
              Exit 1
            }

      - name: Use Node v${{ inputs.node_version }}
        if: ${{ inputs.use_azure_functions_tools == true && inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache node modules
        if: ${{ inputs.use_azure_functions_tools == true }}
        id: cache-nodemodules
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-nodejs-${{ inputs.node_version }}-azurite-${{ inputs.azurite_version }}-func-${{ inputs.azure_functions_core_tools_version }}
          path: ${{ github.workspace }}\node_modules

      - name: Install Azurite v${{ inputs.azurite_version }}
        if: ${{ inputs.use_azure_functions_tools == true && steps.cache-nodemodules.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          npm install azurite@${{ inputs.azurite_version }}

      - name: Install Azure Functions Core Tools v${{ inputs.azure_functions_core_tools_version }}
        if: ${{ inputs.use_azure_functions_tools == true && steps.cache-nodemodules.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          npm install azure-functions-core-tools@${{ inputs.azure_functions_core_tools_version }}

      - name: Install SQL LocalDB 2019
        if: ${{ inputs.use_sqllocaldb_2019 == true }}
        shell: pwsh
        run: |
          Write-Host "Downloading..."
          Import-Module BitsTransfer
          Start-BitsTransfer -Source https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SqlLocalDB.msi -Destination SqlLocalDB.msi
          Write-Host "Installing..."
          Start-Process -FilePath "SqlLocalDB.msi" -Wait -ArgumentList "/qn", "/norestart", "/l*v SqlLocalDBInstall.log", "IACCEPTSQLLOCALDBLICENSETERMS=YES";

      # If a connection cannot be established within <timeout> seconds it fails.
      # We have added a retry action to see if this can mitigate builds failing on this account.
      - name: Verify SQL LocalDB 2019 (with retry)
        if: ${{ inputs.use_sqllocaldb_2019 == true }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_on: error
          shell: pwsh
          command: |
            Write-Host "Checking version..."
            $error.Clear()
            sqlcmd -l 60 -S "(localdb)\MSSQLLocalDB" -Q "SELECT @@VERSION;"
            if ($error)
            {
              Write-Host "Failed"
              Exit 1
            }

      - name: Wait for dotnet-tests artifact to be ready for download
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1 # for each attempt, a healthy artifact should be downloaded within a minute
          max_attempts: ${{ inputs.download_attempt_limit }}
          retry_wait_seconds: 15
          retry_on: any
          command: |
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name dotnet-tests --dir "${{ env.ARTIFACTS_PATH }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Unzip dotnet-tests-outputs.zip
        shell: bash
        env:
          DESTINATION_PATH: ${{ github.workspace }}
          ARCHIVE_FILENAME: ${{ env.ARTIFACTS_PATH }}/dotnet-tests-outputs.zip
        run: |
          mkdir -p "$DESTINATION_PATH"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z x -bso0 -bsp0 "$ARCHIVE_FILENAME" -o"$DESTINATION_PATH" -y
          else
            unzip -q "$ARCHIVE_FILENAME" -d "$DESTINATION_PATH"
          fi

      - name: Login to use Azure resources from automated tests
        if: ${{ inputs.run_integration_tests == true }}
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_integrationtest_spn_id }}
          tenant-id: ${{ inputs.azure_integrationtest_tenant_id }}
          subscription-id: ${{ inputs.azure_integrationtest_subscription_id }}
          allow-no-subscriptions: true # Added as a workaround for the issue https://github.com/Azure/login/issues/592

      - name: Login to Azure Container Registry
        if: ${{ inputs.run_integration_tests == true && runner.os == 'Linux' }}
        shell: bash
        run: az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}

      # To ensure code coverage tooling is available in bin folders, teams must use 'publish' on test assemblies
      # See https://github.com/coverlet-coverage/coverlet/issues/521#issuecomment-522429394
      - name: Run tests
        if: ${{ inputs.tests_dll_file_path != '' }}
        shell: pwsh
        run: |
          # Configure content root for WebApplicationFactory<TEntryPoint>
          if ( '${{ inputs.aspnetcore_test_contentroot_variable_name }}' -ne 'empty' )
          {
            $Env:${{ inputs.aspnetcore_test_contentroot_variable_name }} = '${{ github.workspace }}${{ inputs.aspnetcore_test_contentroot_variable_value }}'
          }
          # Handle filter expression
          if ( '${{ inputs.tests_filter_expression }}' -eq 'empty' )
          {
            dotnet test ${{ github.workspace }}${{ inputs.tests_dll_file_path }} `
              --logger:"console;verbosity=normal" --logger:"trx;logfilename=logs.trx" `
          }
          else
          {
            dotnet test ${{ github.workspace }}${{ inputs.tests_dll_file_path }} `
              --filter '${{ inputs.tests_filter_expression }}' `
              --logger:"console;verbosity=normal" --logger:"trx;logfilename=logs.trx" `
          }

          $testFailures = Select-String -Path '.\TestResults\logs.trx' -Pattern '\[FAIL\]'
          $testFailures

      - name: Run tests (Microsoft.Testing.Platform)
        if: ${{ inputs.tests_exe_file_path != '' }}
        shell: pwsh
        run: |
          # Configure content root for WebApplicationFactory<TEntryPoint>
          if ( '${{ inputs.aspnetcore_test_contentroot_variable_name }}' -ne 'empty' )
          {
            $Env:${{ inputs.aspnetcore_test_contentroot_variable_name }} = '${{ github.workspace }}${{ inputs.aspnetcore_test_contentroot_variable_value }}'
          }

          $testExecutable = '${{ github.workspace }}${{ inputs.tests_exe_file_path }}'
          if ( -not (Test-Path $testExecutable) )
          {
            Write-Host "::error::Test executable not found: $testExecutable"
            Exit 1
          }

          # Written to a well known location so the 'Publish test report' step can find it
          $resultsDirectory = '${{ github.workspace }}\TestResults'
          $arguments = @('--results-directory', $resultsDirectory, '--report-trx', '--report-trx-filename', 'logs.trx')

          # Handle filter expression
          if ( '${{ inputs.tests_filter_expression }}' -ne 'empty' )
          {
            $arguments += @('--filter', '${{ inputs.tests_filter_expression }}')
          }

          # No need to change the working directory before running the executable. The
          # Microsoft.Testing.Platform runner sets the current directory to the folder holding the
          # test assembly, so content files and appsettings next to it resolve as they do locally.
          & $testExecutable @arguments
          $testExitCode = $LASTEXITCODE

          $trxFile = Join-Path $resultsDirectory 'logs.trx'
          if ( Test-Path $trxFile )
          {
            Select-String -Path $trxFile -Pattern 'outcome="Failed"'
          }

          # Any non zero exit code is a failure. Note that Microsoft.Testing.Platform exits with 8
          # when zero tests ran, which would otherwise silently hide a broken filter expression.
          if ( $testExitCode -ne 0 )
          {
            Write-Host "::error::Test run failed with exit code $testExitCode"
            Exit $testExitCode
          }

      # 'always()' lets the report be published for failing tests, but must not let it run when the
      # inputs never named a test project, as there would be no results to report on
      - name: Publish test report
        if: ${{ inputs.publish_test_results == true && steps.validate_inputs.outcome == 'success' && always() }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: Test results for ${{ inputs.tests_dll_file_path || inputs.tests_exe_file_path }}
          comment_title: Test results for ${{ inputs.tests_dll_file_path || inputs.tests_exe_file_path }}
          comment_mode: failures
          files: |
            **/TestResults/*.trx
