name: Custom Deployment

on:
  workflow_call:
    inputs:
      targets:
        description: |
          JSON targets for the deployment. It should be an array of objects with the following properties:
          - name: Descriptive name of the target, e.g. "My Service" or "Databricks wheel"
          - image: (Optional) The full name of the image to deploy, e.g. repository/image, leave empty for zip deployments.
          - artifact_type: (Optional) OCI artifact type. Has no effect when image is not specified. Defaults to application/vnd.oci.image.index.v1+json.
          - pull_request_number: Pull request number to deploy, if empty the variable will not be updated but the deployment workflow will still be triggered
          - terraform_path: Path to Terraform configuration file to update, e.g. path/to/terraform.tfvars
          - terraform_variable_names: Names of Terraform variables to update (newline separated), e.g. variable1\nvariable2
        required: true
        type: string
      workflow_repository:
        description: Repository containing the deployment workflow
        required: false
        type: string
        default: Energinet-DataHub/dh3-infrastructure
      workflow_name:
        description: Name of the deployment workflow
        required: true
        type: string
      environment:
        description: Environment to start deployment workflow for
        required: true
        type: string
      deployment_branch:
        description: Git branch to start deployment workflow from
        required: true
        type: string
      deployment_base_branch:
        description: Git ref to base the deployment branch on, defaults to main
        required: true
        type: string
        default: main
      app_client_id:
        description: Client ID of the GitHub App used to push to the infrastructure repository and trigger the deployment workflow
        required: true
        type: string
    secrets:
      app_private_key:
        description: Private key of the GitHub App used to push to the infrastructure repository and trigger the deployment workflow
        required: true

permissions:
  packages: read
  contents: read

jobs:
  deploy:
    name: Update terraform variables and trigger deployment
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: generate_token
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: Energinet-DataHub

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Checkout infrastructure repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.workflow_repository }}
          path: infra-repo
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup committer and switch branch
        shell: bash
        working-directory: infra-repo
        env:
          DEPLOYMENT_BASE_BRANCH: ${{ inputs.deployment_base_branch }}
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${DEPLOYMENT_BASE_BRANCH}"
          git checkout -B "${DEPLOYMENT_BRANCH}" "FETCH_HEAD"

      - name: Process targets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $defaultArtifactType = "application/vnd.oci.image.index.v1+json"

          $targets = $env:TARGETS | ConvertFrom-Json

          foreach ($target in $targets) {
            $name = $target.name

            $prNumber = $target.pull_request_number
            $terraformPath = $target.terraform_path
            $terraformVariableNames = $target.terraform_variable_names
            $artifactType = if ($target.artifact_type) { $target.artifact_type } else { $defaultArtifactType }

            Write-Output "::group::$name (PR #$prNumber)"

            if (-not $prNumber) {
              Write-Output "No pull request number specified for $name, skipping variable update but will still trigger deployment workflow"
              Write-Output "::endgroup::"
              continue
            }

            $variableValue = "pr$prNumber"

            if ($target.image) {
              $image = $target.image.ToLower()
              $reference = "ghcr.io/${image}:${variableValue}"
              $descriptor = oras manifest fetch --descriptor $reference | ConvertFrom-Json
              if ([string]::IsNullOrEmpty($descriptor.digest)) {
                Write-Output "::error::No OCI manifest found for ${image}:${variableValue}. Ensure it has been built."
                exit 1
              }

              $manifest = oras manifest fetch $reference | ConvertFrom-Json
              $actualArtifactType = if ($manifest.artifactType) { $manifest.artifactType } else { $descriptor.mediaType }
              if ($actualArtifactType -ne $artifactType) {
                Write-Output "::error::OCI manifest ${image}:${variableValue} has type '$actualArtifactType', expected '$artifactType'."
                exit 1
              }

              $tag = if ($artifactType -eq $defaultArtifactType) { "${variableValue}@$($descriptor.digest)" } else { $variableValue }
              $summary = "${image} resolved ${variableValue} to $($descriptor.digest) as $actualArtifactType"
              Write-Output $summary
              $summary >> $env:GITHUB_STEP_SUMMARY
            }
            else
            {
              $tag = $variableValue
            }

            # Update variable values (unchanged logic from create-pr-in-dh3-infra.yml in .github repo)
            $file = "infra-repo/$terraformPath"

            if (-not (Test-Path $file)) {
              New-Item -Path $file -ItemType File -Force | Out-Null
              Write-Output "::warning::Variable file did not exist, it has been created"
            }

            # Contains the list of new variables that was added to the variable file.
            $newVars = @()

            $vars = $terraformVariableNames
            $vars -split "`n" | ForEach-Object {
              $varname = $_.Trim()
              if (-not $varname) { return }

              $content = Get-Content $file
              $pattern = "^\s*${varname}\s*="
              $found = $false

              $newContent = $content | ForEach-Object {
                if ($_ -match $pattern) {
                  $found = $true
                  $_ -replace '(")[^"]*(")', "`"$tag`""
                } else {
                  $_
                }
              }

              if ($found) {
                $newContent | Set-Content $file
              } else {
                $newVar = "$varname = `"$tag`""
                Add-Content $file $newVar
                $newVars += $varname
                Write-Output "::warning::A new variable ($varname) was added to the variable file"
              }
            }

            Write-Output "::endgroup::"
          }

      - name: Commit and force push changes
        working-directory: infra-repo
        shell: pwsh
        run: |
          git add .
          if (git diff --cached --quiet) {
            $summary = "No changes to commit, pushing branch as-is"
            Write-Output $summary
            $summary >> $env:GITHUB_STEP_SUMMARY
          } else {
            git commit --author "${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>" -m "Update variable values from deployment targets"
          }
          git push origin ${{ inputs.deployment_branch }} --force

      - name: Trigger deployment workflow
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          $summary = gh workflow run ${{ inputs.workflow_name }} -R ${{ inputs.workflow_repository }} -F selected_environment=${{ inputs.environment }} -r ${{ inputs.deployment_branch }}
          Write-Output $summary
          $summary >> $env:GITHUB_STEP_SUMMARY
